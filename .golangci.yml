# golangci-lint v2 configuration. The version is pinned in .github/workflows/ci.yml.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Explicit list instead of "standard" so a golangci-lint upgrade can't enable
  # new linters behind our back.
  default: none
  enable:
    # Correctness
    - errcheck # unchecked errors
    - govet # go vet, with the analyzers below
    - staticcheck # SA (bugs), S (simplifications), ST (style), QF (quick fixes)
    - unused # dead code
    - ineffassign # assignments that are never read
    - errorlint # error comparisons that break with wrapping (== instead of errors.Is)
    # Security and resource handling: ctq makes HTTP and Postgres calls to
    # third-party services, so leaked bodies and missing contexts matter.
    - gosec
    - bodyclose # unclosed http.Response.Body
    - noctx # HTTP requests and DB calls without a context
    # Hygiene
    - misspell
    - nolintlint # every //nolint names its linter and says why
  settings:
    errcheck:
      # Discarding with `_ =` is an explicit decision; only flag silent drops.
      check-blank: false
    govet:
      enable:
        - nilness
    gosec:
      excludes:
        # Unhandled errors: errcheck owns this, with the std-error-handling
        # preset below. G104 would re-flag every best-effort Close/Remove.
        - G104
    # misspell: no locale on purpose, so both US and UK spellings pass
    # ("cancelled" is used here).
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        # Package comments: a CLI with internal packages doesn't need them.
        - -ST1000
        # Comment form ("Foo does ..."): style only, too noisy for little value.
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    # Built-in exclusion presets for well-known false positives.
    presets:
      - std-error-handling # e.g. unchecked Close/Flush/Print on writers
    rules:
      # Tests may use weak randomness, hardcoded fixtures, and unchecked errors
      # on test plumbing.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jfagoagas/ctq

issues:
  # Report everything; the defaults hide repeats of the same issue.
  max-issues-per-linter: 0
  max-same-issues: 0
