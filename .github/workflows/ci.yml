name: ci

on:
  push:
    branches: [main]
  pull_request:

# No token permissions by default. Each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main branch ruleset requires a check named "Test". Matrix jobs report as
  # "Test (<os>)", so this job keeps the required name and passes only when every
  # OS passed. Update the ruleset before renaming it.
  test:
    name: Test
    needs: test-os
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All OS test jobs passed
        env:
          RESULT: ${{ needs.test-os.result }}
        run: test "$RESULT" = success

  test-os:
    name: Test (${{ matrix.os }})
    # Releases ship darwin and windows binaries, and file handling (renaming
    # over an existing file, path separators) differs per OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # same syntax on Windows (Git Bash)
    steps:
      # Actions are pinned to commit SHAs. Tags can be moved; SHAs can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Formatting and module tidiness don't depend on the OS: check them once.
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      # -shuffle=on surfaces tests that depend on running order; the seed is
      # printed so a failure can be replayed with -shuffle=<seed>.
      - run: go test -race -shuffle=on ./...

  govulncheck:
    name: Vulnerability reachability (govulncheck)
    # grype (vulnscan) is the release gate and flags every vulnerable module.
    # govulncheck adds call-graph reachability: it fails only when our code can
    # reach the vulnerable symbol, including in the standard library.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go run with an exact version: the repo's Actions policy doesn't allow
      # golang/govulncheck-action, and the module proxy checksum pins the code.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  golangci-lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Also verifies .golangci.yml against the schema (verify: true by default).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  trufflehog:
    name: Secret scan (trufflehog)
    # Scans the commits in the push (before..after) or the PR (base..head), not
    # just the tip: a secret added and then deleted is still in the history.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scanned range needs both ends
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4c282f54c0160102ccbebba421b89f3c3af6404d # v3.98.1
        with:
          # The action runs this image tag; the digest pins it like the SHA above.
          version: 3.98.1@sha256:7f1763b872981561538f5d67a4c8247144729dda8110dee83d60b942cd138432
          extra_args: --results=verified,unknown

  goreleaser-check:
    name: GoReleaser config
    # Catches a broken .goreleaser.yaml on the PR, not when a tag is pushed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  vulnscan:
    name: Vulnerability scan
    uses: $/.github/workflows/vulnscan.yml
    permissions:
      contents: read
      security-events: write # grype findings to code scanning

  zizmor:
    name: Workflow security (zizmor)
    # Static analysis of the workflows themselves: injection, over-broad
    # permissions, unpinned actions, credential leaks, cache poisoning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to code scanning (Security tab)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1 # pinned: new rules shouldn't fail CI without a code change
          persona: auditor
