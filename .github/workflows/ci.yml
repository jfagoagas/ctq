name: ci

on:
  push:
    branches: [main]
  pull_request:

# No token permissions by default. Each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs. Tags can be moved; SHAs can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # The next three jobs mirror .pre-commit-config.yaml, so a commit made with
  # --no-verify still gets every check on the pull request.

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go mod tidy runs with this Go; golang hooks (actionlint) build with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pre-commit
        run: pipx install pre-commit==4.2.0
      - name: Run hooks
        env:
          # These have their own jobs: golangci-lint and trufflehog below, and
          # zizmor (same version and persona, plus code scanning upload).
          SKIP: golangci-lint-config-verify,golangci-lint-full,trufflehog,zizmor
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  golangci-lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Also verifies .golangci.yml against the schema (verify: true by default).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # same as .pre-commit-config.yaml; bump both together

  trufflehog:
    name: Secret scan (trufflehog)
    # Scans the commits in the push (before..after) or the PR (base..head), not
    # just the tip: a secret added and then deleted is still in the history.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scanned range needs both ends
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4c282f54c0160102ccbebba421b89f3c3af6404d # v3.98.1
        with:
          # The action runs this image tag; the digest pins it like the SHA above.
          version: 3.98.1@sha256:7f1763b872981561538f5d67a4c8247144729dda8110dee83d60b942cd138432
          extra_args: --results=verified,unknown

  goreleaser-check:
    name: GoReleaser config
    # Catches a broken .goreleaser.yaml on the PR, not when a tag is pushed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  vulnscan:
    name: Vulnerability scan
    uses: $/.github/workflows/vulnscan.yml
    permissions:
      contents: read
      security-events: write # grype findings to code scanning

  zizmor:
    name: Workflow security (zizmor)
    # Static analysis of the workflows themselves: injection, over-broad
    # permissions, unpinned actions, credential leaks, cache poisoning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to code scanning (Security tab)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1 # pinned: new rules shouldn't fail CI without a code change
          persona: auditor
