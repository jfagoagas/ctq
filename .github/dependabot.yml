# Keeps the SHA-pinned actions and Go modules current. Pinning by SHA without
# updates means quietly missing security fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a new release: compromised versions are usually
    # caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]

  # SHA-pinned hook revs in .pre-commit-config.yaml. A golangci-lint or zizmor
  # bump must also update the matching version in ci.yml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
