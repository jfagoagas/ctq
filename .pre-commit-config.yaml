# Local checks before commit and push. Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Every hook here also runs in CI (.github/workflows/ci.yml), so skipping them
# with --no-verify only moves the failure to the pull request:
#   - "pre-commit" job: this file, minus the hooks with a dedicated job
#   - golangci-lint-full, golangci-lint-config-verify: "golangci-lint" job
#   - trufflehog: "trufflehog" job (scans the PR commit range)
#   - go-test (pre-push): "test" job
#
# Revs are pinned to commit SHAs, like the actions in .github/workflows. Tags
# can be moved; SHAs can't. Bump with: pre-commit autoupdate --freeze
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      # These three default to pre-push as well; once at commit time is enough.
      - id: check-added-large-files # 500 KB, new files only
        stages: [pre-commit]
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/golangci/golangci-lint
    # Same version as the golangci-lint job in ci.yml. Built from source with
    # the local Go, so it can lint go1.26 code (never use a v1 binary).
    rev: 114493f9b3e7257d29e4130f2b4a4aadefbb6845 # frozen: v2.14.0
    hooks:
      - id: golangci-lint-config-verify
      # The whole module, not --new-from-rev: "unused" needs every file, and
      # it matches what CI runs. Cached runs take a couple of seconds.
      - id: golangci-lint-full

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: 4c282f54c0160102ccbebba421b89f3c3af6404d # frozen: v3.98.1
    hooks:
      - id: trufflehog
        # Staged changes only (HEAD..HEAD plus the index). Fail on verified and
        # unknown (verification errored) results; unverified is too noisy.
        entry: trufflehog git file://. --since-commit HEAD --results=verified,unknown --fail --no-update --trust-local-git-config
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    # Same version and persona as the zizmor job in ci.yml.
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=auditor]

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy (check only)
        # -diff prints what tidy would change and fails, without touching files.
        entry: go mod tidy -diff
        language: system
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false
      - id: go-test
        name: go test -race
        entry: go test -race ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
