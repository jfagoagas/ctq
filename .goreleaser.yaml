# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Runs from .github/workflows/release.yml on every v* tag. Validate locally with:
#   goreleaser check
version: 2

project_name: ctq

before:
  hooks:
    # Fail the release if go.sum doesn't match the downloaded modules.
    - go mod verify

builds:
  - id: ctq
    main: .
    binary: ctq
    env:
      - CGO_ENABLED=0 # static binaries, no libc dependency
    flags:
      - -trimpath # no local paths in the binary, needed for reproducible builds
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # File timestamps from the commit, not the build time, so rebuilding the
    # same tag produces the same archives and checksums.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: ctq
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# One SPDX SBOM per archive, generated by syft from the Go build info in the
# binary. Per platform on purpose: dependencies differ by OS (Bubble Tea pulls
# in a Windows-only console package), so one shared SBOM would be wrong.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    # SPDX version pinned: actions/attest-sbom derives the attestation's predicate
    # type from it (SPDX-2.3 -> https://spdx.dev/Document/v2.3), and the verify
    # command in the release notes depends on that exact type.
    args: ["$artifact", "--output", "spdx-json@2.3=$document"]
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  # v1.2.3-rc.1 and similar are published as pre-releases.
  prerelease: auto
  footer: |
    ## Verify

    Every archive has a signed SLSA build provenance attestation and an SBOM attestation:

    ```sh
    gh attestation verify ctq_{{ .Version }}_linux_amd64.tar.gz --repo {{ .Env.GITHUB_REPOSITORY }}
    gh attestation verify ctq_{{ .Version }}_linux_amd64.tar.gz --repo {{ .Env.GITHUB_REPOSITORY }} --predicate-type https://spdx.dev/Document/v2.3
    ```
